[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nonoka-x"
version = "0.5.0"
description = "Nonoka Sub X"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
  "httpx>=0.27,<1",
  # FineSub's `[harness]` extra, less `cryptography` (imported only to sign a
  # knowledge-share snapshot). With these the launcher can continue a cloud
  # task from its stable.json without the managed ASR runtime: the LLM layer
  # resolves America/Los_Angeles at import, and Windows has no tz database.
  "opencc-python-reimplemented",
  "pydantic>=2,<3",
  "tzdata ; platform_system == 'Windows'",
]

[project.scripts]
nonoka-sidecar = "nonoka_x.sidecar:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["nonoka_x*"]

[tool.setuptools.package-data]
nonoka_x = ["resources/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
