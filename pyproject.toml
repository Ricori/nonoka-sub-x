[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nonoka-x"
version = "0.3.2"
description = "Nonoka Sub X"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2,<3",
]

[project.scripts]
nonoka-sidecar = "nonoka_x.sidecar:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["nonoka_x*"]

[tool.setuptools.package-data]
nonoka_x = ["resources/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
