# Wails 3 project metadata and development orchestration.
# Run `task build-assets` after changing info or fileAssociations.
version: '3'

info:
  companyName: "Ricori"
  productName: "Nonoka Sub X"
  productIdentifier: "app.nonoka.desktop"
  description: "Nonoka Sub X"
  copyright: "© 2026 Ricori"
  comments: "Desktop workstation for AI subtitle generation and professional editing."
  version: "0.3.2"

dev_mode:
  root_path: .
  log_level: warn
  debounce: 800
  ignore:
    dir:
      - .git
      - .tools
      - bin
      - build
      - frontend
    file:
      - .gitignore
      - .gitkeep
      - "*_test.go"
    watched_extension:
      - "*.go"
    git_ignore: true
  executes:
    - cmd: go tool wails3 build DEV=true
      type: blocking
    - cmd: go tool wails3 task common:dev:frontend
      type: background
    - cmd: go tool wails3 task run DEV=true
      type: primary

fileAssociations: []
