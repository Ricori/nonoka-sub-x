[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nonoka-x-compute"
version = "0.1.0"
requires-python = ">=3.12"
# What `modal deploy` needs locally. The containers carry their own
# dependencies (`nonoka_x_compute/images.py`).
dependencies = ["modal>=1.1", "fastapi>=0.116"]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["."]
include = ["nonoka_x_compute*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
